<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiteRT-LM spike</title>
    <!--
      THROWAWAY SPIKE PAGE — delete before merging the LiteRT provider.

      Question it answers: does @litert-lm/core load `.litertlm` files that are NOT the
      official `-web.litertlm` builds? Only 5 genuine `-web` files exist (all Gemma 4,
      smallest 2008 MB), which is far too big for an iPhone. If any of the small plain
      `.litertlm` files below load and generate coherently, they become Joyce's mobile
      tier; if none do, LiteRT gets feature-gated off on mobile.
    -->
    <script type="importmap">
      {
        "imports": {
          "@litert-lm/core": "https://cdn.jsdelivr.net/npm/@litert-lm/core@0.15.0/+esm"
        }
      }
    </script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem;
        line-height: 1.4;
      }
      h1 {
        font-size: 1.2rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.85rem;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 0.3rem 0.5rem;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #eee;
      }
      td.num {
        text-align: right;
        white-space: nowrap;
      }
      .ok {
        color: #0a0;
        font-weight: bold;
      }
      .fail {
        color: #c00;
        font-weight: bold;
      }
      .pending {
        color: #888;
      }
      .sample {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        max-width: 30rem;
        word-break: break-word;
      }
      #env {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        background: #f6f6f6;
        padding: 0.5rem;
        white-space: pre-wrap;
      }
      button {
        padding: 0.3rem 0.6rem;
        margin-right: 0.4rem;
      }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 0.7rem;
        max-height: 12rem;
        overflow: auto;
        background: #111;
        color: #ddd;
        padding: 0.5rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>LiteRT-LM spike — do small non-<code>-web</code> models load?</h1>
    <div id="env">probing…</div>
    <p>
      <button id="run-small">Run small models (&lt;1.2 GB)</button>
      <button id="run-control">Run control (Gemma 4 E2B, 2 GB)</button>
      <button id="copy">Copy results</button>
    </p>
    <table id="results">
      <thead>
        <tr>
          <th>Model</th>
          <th class="num">MB</th>
          <th>Backend</th>
          <th>Result</th>
          <th class="num">Load s</th>
          <th class="num">tok/s</th>
          <th>Sample / error</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <h2 style="font-size: 1rem">Log</h2>
    <div id="log"></div>

    <script type="module">
      import { Backend, Engine, loadLiteRtLm } from "@litert-lm/core";

      const WASM_URL =
        "https://cdn.jsdelivr.net/npm/@litert-lm/core@0.15.0/wasm";
      const PROMPT = "In two sentences, what is a web browser?";
      const MAX_TOKENS = 1024;

      // Backends worth trying. GPU_ARTISAN streams weights straight to the GPU; the
      // others copy the whole model into the wasm heap first (fine at these sizes).
      const BACKENDS = [
        ["GPU_ARTISAN", Backend.GPU_ARTISAN],
        ["CPU_ARTISAN", Backend.CPU_ARTISAN],
        ["CPU", Backend.CPU],
      ];

      // NOTE: litert-community/gemma-3-270m-it and litert-community/Gemma3-1B-IT are
      // `gated: auto` on HF — they 401 without an auth token, so a static browser app
      // can't fetch them at all. Excluded. Everything below is ungated and serves
      // `access-control-allow-origin: *` with range support, as do the Gemma 4 models
      // we actually ship (those are NOT gated).
      const SMALL_MODELS = [
        {
          name: "Qwen3-0.6B int4-b32",
          repo: "litert-community/Qwen3-0.6B",
          file: "Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm",
          mb: 328,
        },
        {
          name: "Qwen3-0.6B-int4 ekv1280",
          repo: "litert-community/Qwen3-0.6B-int4",
          file: "qwen3_0.6b_q4_block32_ekv1280.litertlm",
          mb: 347,
        },
        {
          name: "SmolLM2-360M-Instruct",
          repo: "litert-community/SmolLM2-360M-Instruct",
          file: "SmolLM2_360M_instruct.litertlm",
          mb: 374,
        },
        {
          // Uploader renamed a plain .litertlm to "-web" — byte-identical to its siblings.
          name: 'MiniCPM5-1B "web"',
          repo: "Tdamre/MiniCPM5-1B-litert-lm",
          file: "MiniCPM5-1B-web.litertlm",
          mb: 1103,
        },
      ];

      const CONTROL_MODELS = [
        {
          name: "gemma-4-E2B-it-web (control)",
          repo: "litert-community/gemma-4-E2B-it-litert-lm",
          file: "gemma-4-E2B-it-web.litertlm",
          mb: 2008,
        },
      ];

      const modelUrl = ({ repo, file }) =>
        `https://huggingface.co/${repo}/resolve/main/${file}`;

      const logEl = document.getElementById("log");
      const log = (msg) => {
        logEl.textContent += `${msg}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      };

      const tbody = document.querySelector("#results tbody");
      const addRow = (model, backendName) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${model.name}</td>
          <td class="num">${model.mb}</td>
          <td>${backendName}</td>
          <td class="pending">running…</td>
          <td class="num"></td>
          <td class="num"></td>
          <td class="sample"></td>`;
        tbody.appendChild(tr);
        return {
          finish(ok, { loadSecs, tokPerSec, sample }) {
            const cells = tr.querySelectorAll("td");
            cells[3].className = ok ? "ok" : "fail";
            cells[3].textContent = ok ? "LOADED" : "FAILED";
            cells[4].textContent = loadSecs == null ? "" : loadSecs.toFixed(1);
            cells[5].textContent =
              tokPerSec == null ? "" : tokPerSec.toFixed(1);
            cells[6].textContent = sample ?? "";
          },
        };
      };

      // --- environment probe -------------------------------------------------
      const probeEnv = async () => {
        const lines = [`ua: ${navigator.userAgent}`];
        lines.push(`caches API: ${typeof caches !== "undefined"}`);
        lines.push(`crossOriginIsolated: ${self.crossOriginIsolated}`);
        if (!navigator.gpu) {
          lines.push("webgpu: UNAVAILABLE");
        } else {
          try {
            const adapter = await navigator.gpu.requestAdapter({
              powerPreference: "high-performance",
            });
            if (!adapter) {
              lines.push("webgpu: no adapter");
            } else {
              const l = adapter.limits;
              lines.push(
                `webgpu maxBufferSize: ${(l.maxBufferSize / 1048576).toFixed(0)} MB`,
              );
              lines.push(
                `webgpu maxStorageBufferBindingSize: ${(l.maxStorageBufferBindingSize / 1048576).toFixed(0)} MB`,
              );
              lines.push(
                `webgpu features: shader-f16=${adapter.features.has("shader-f16")} subgroups=${adapter.features.has("subgroups")}`,
              );
            }
          } catch (err) {
            lines.push(`webgpu probe error: ${err.message}`);
          }
        }
        if (navigator.storage?.estimate) {
          const { quota, usage } = await navigator.storage.estimate();
          lines.push(
            `storage: ${(usage / 1048576).toFixed(0)} MB used / ${(quota / 1048576).toFixed(0)} MB quota`,
          );
        }
        document.getElementById("env").textContent = lines.join("\n");
      };

      // --- single (model, backend) trial -------------------------------------
      const trial = async (model, [backendName, backend]) => {
        const row = addRow(model, backendName);
        const url = modelUrl(model);
        log(`--- ${model.name} @ ${backendName}`);
        let engine = null;
        try {
          const loadStart = performance.now();
          engine = await Engine.create({
            model: url,
            backend,
            benchmarkEnabled: true,
            mainExecutorSettings: { maxNumTokens: MAX_TOKENS },
          });
          const loadSecs = (performance.now() - loadStart) / 1000;
          log(`  engine created in ${loadSecs.toFixed(1)}s`);

          const conversation = await engine.createConversation({
            preface: {
              messages: [
                { role: "system", content: "You are a helpful assistant." },
              ],
            },
          });

          const genStart = performance.now();
          let text = "";
          for await (const chunk of conversation.sendMessageStreaming(PROMPT)) {
            for (const item of chunk.content ?? []) {
              if (item.type === "text") text += item.text;
            }
            if (text.length > 300) break; // enough to judge coherence
          }
          const genSecs = (performance.now() - genStart) / 1000;

          let tokPerSec = null;
          try {
            const bench = await conversation.getBenchmarkInfo();
            tokPerSec = bench.lastDecodeTokensPerSecond;
            log(
              `  bench: prefill ${bench.lastPrefillTokensPerSecond?.toFixed(0)} tok/s, ` +
                `decode ${bench.lastDecodeTokensPerSecond?.toFixed(1)} tok/s, ` +
                `ttft ${bench.timeToFirstTokenInSecond?.toFixed(2)}s`,
            );
          } catch (err) {
            log(`  getBenchmarkInfo failed: ${err.message}`);
            tokPerSec = text.length / 4 / genSecs; // rough fallback
          }

          await conversation.delete();
          log(`  output: ${JSON.stringify(text.slice(0, 200))}`);
          row.finish(true, { loadSecs, tokPerSec, sample: text.slice(0, 200) });
          return true;
        } catch (err) {
          log(`  FAILED: ${err?.name}: ${err?.message}`);
          row.finish(false, {
            loadSecs: null,
            tokPerSec: null,
            sample: `${err?.name}: ${err?.message}`,
          });
          return false;
        } finally {
          try {
            await engine?.delete();
          } catch (err) {
            log(`  engine.delete() threw: ${err.message}`);
          }
        }
      };

      // Try backends in order; stop at the first that works for this model.
      const runSet = async (models) => {
        for (const model of models) {
          for (const backend of BACKENDS) {
            const ok = await trial(model, backend);
            if (ok) break;
          }
        }
        log("=== done ===");
      };

      const withButtonsDisabled = async (fn) => {
        const buttons = [...document.querySelectorAll("button")];
        buttons.forEach((b) => (b.disabled = true));
        try {
          await fn();
        } finally {
          buttons.forEach((b) => (b.disabled = false));
        }
      };

      await probeEnv();
      log(`loading wasm from ${WASM_URL} …`);
      try {
        await loadLiteRtLm(WASM_URL);
        log("wasm loaded");
      } catch (err) {
        log(`WASM LOAD FAILED: ${err?.name}: ${err?.message}`);
      }

      document.getElementById("run-small").onclick = () =>
        withButtonsDisabled(() => runSet(SMALL_MODELS));
      document.getElementById("run-control").onclick = () =>
        withButtonsDisabled(() => runSet(CONTROL_MODELS));
      document.getElementById("copy").onclick = () => {
        const text = [
          document.getElementById("env").textContent,
          "",
          [...tbody.rows]
            .map((r) =>
              [...r.cells].map((c) => c.textContent.trim()).join(" | "),
            )
            .join("\n"),
          "",
          logEl.textContent,
        ].join("\n");
        navigator.clipboard.writeText(text);
      };
    </script>
  </body>
</html>
