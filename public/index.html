    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link

      href="https://nearform.com/favicon.ico"

      sizes="32x32"

    <link

    />
    <link

      href="https://nearform.com/favicon.svg"

    <link rel="icon" href="https://nearform.com/favicon.png" type="image/png" />

    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/combine/npm/purecss@2.0.3/site/static/layouts/side-menu/styles.css"
    />
    <link rel="stylesheet" href="./styles.css" />

      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css"
    />
    <title>Joyce</title>
  </head>

  <body>
    <div id="root"></div>

    <!-- GitHub Pages SPA redirect handler -->
    <script>
      // Check if we were redirected from 404.html
      (function () {
        const redirectPath = sessionStorage.getItem("ghpages_redirect_path");
        if (redirectPath) {
          // Clear the stored path and replace the current history entry with the SPA path.
          sessionStorage.removeItem("ghpages_redirect_path");
          window.history.replaceState(null, "", redirectPath);
        }
      })();
    </script>

    <!-- Deps
      - @xenova/transformers@2.17.2 is UMD and breaks with '+esm' added. 
      - "crashbox": "https://cdn.jsdelivr.net/npm/crashbox@0.1.0/+esm",
      - "crashbox": "/vendor/crashbox/src/index.js",
    -->
    <script type="importmap">
      {
        "imports": {
          "@mlc-ai/web-llm": "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.83/+esm",
          "@orama/orama": "https://cdn.jsdelivr.net/npm/@orama/orama@3.1.18/+esm",
          "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2",
          "crashbox": "https://cdn.jsdelivr.net/npm/crashbox@0.1.0/+esm",
          "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.3.1/+esm",
          "file-saver": "https://cdn.jsdelivr.net/npm/file-saver@2.0.5/+esm",
          "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/+esm",
          "llm-splitter": "https://cdn.jsdelivr.net/npm/llm-splitter@0.2.0/+esm",
          "marked": "https://cdn.jsdelivr.net/npm/marked@17.0.1/+esm",
          "react": "https://cdn.jsdelivr.net/npm/react@19.2.3/+esm",
          "react/jsx-runtime": "https://cdn.jsdelivr.net/npm/react@19.2.3/jsx-runtime/+esm",
          "react-dom": "https://cdn.jsdelivr.net/npm/react-dom@19.2.3/+esm",
          "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@19.2.3/client/+esm",
          "react-is": "https://cdn.jsdelivr.net/npm/react-is@19.2.3/+esm",
          "react-select": "https://cdn.jsdelivr.net/npm/react-select@5.10.2/+esm",
          "react-router": "https://cdn.jsdelivr.net/npm/react-router@7.11.0/+esm",

          "https://cdn.jsdelivr.net/npm/react@19.0.0/": "https://cdn.jsdelivr.net/npm/react@19.2.3/",
          "https://cdn.jsdelivr.net/npm/react@19.1.0/": "https://cdn.jsdelivr.net/npm/react@19.2.3/",
          "https://cdn.jsdelivr.net/npm/react-dom@19.1.0/": "https://cdn.jsdelivr.net/npm/react-dom@19.2.3/"
        }
      }
    </script>
    <script type="module">
      import React from "react";
      import ReactDOM from "react-dom/client";
      import { html } from "./app/util/html.js";
      import { App } from "./app/index.js";
      import { getSettings } from "./app/hooks/use-settings.js";
      import { bootstrap, breadcrumb } from "./local/data/telemetry.js";
      import { init } from "./local/data/loading.js";
      import { getSystemInfo, getDeviceInfo } from "./local/data/util.js";
      import { CHROME_ANY_API_POSSIBLE } from "./shared-config.js";

      // Must run before anything else so the previous session is recovered and a fresh
      // session is recording before resource loads start emitting breadcrumbs. Gated on
      // the experimental flag — when off, every breadcrumb/wrap/setSnapshot call site
      // in the app silently no-ops via crashbox's built-in pre-init guards.
      if (getSettings().experimentalCrashbox) {
        bootstrap();
        breadcrumb("app:boot");
      }

      // Initialize loaders early and get system info.
      init();
      const systemInfo = await getSystemInfo();
      const deviceInfo = getDeviceInfo();

      // TODO(LOCAL): Add config or remove.
      const config = {
        systemInfo,
        deviceInfo,
        // TODO(CHAT): Move somewhere else?
        providers: {
          webLlm: {
            enabled: true,
          },
          chrome: {
            enabled: CHROME_ANY_API_POSSIBLE,
          },
        },
      };
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(html`<${App} config=${config} />`);
    </script>
  </body>
</html>
